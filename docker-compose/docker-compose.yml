services:
  masierp:
    image: masierp
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiERP
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiERP
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      masierp-postgresql:
        condition: service_healthy
      # masierp-elasticsearch:
      #   condition: service_healthy
  masiemployee:
    image: masiemployee
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiEmployee
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiEmployee
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      masierp-postgresql:
        condition: service_healthy
    volumes:
      - ./masiemployee-upload:/uploaded-files
    restart: unless-stopped
  masilogistics:
    image: masilogistics
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiLogistics
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiLogistics
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      masierp-postgresql:
        condition: service_healthy
    # volumes:
    #   - ./masiemployee-upload:/uploaded-files
    restart: unless-stopped
  masiproduction:
    image: masiproduction
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiProduction
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiProduction
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8082:8082"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      masierp-postgresql:
        condition: service_healthy
      #  masierp-elasticsearch:
      #    condition: service_healthy
    restart: unless-stopped
  masisale: 
    image: masisale
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiSale
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiSale
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8084:8083"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8083/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      masierp-postgresql:
        condition: service_healthy
      masiemployee:
        condition: service_started
    restart: unless-stopped    
    volumes:
      - ./masisale-upload:/uploaded-files
  masierp-postgresql:
    image: postgres:16.1
    command:  -c 'max_connections=500' -c 'wal_level=logical'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=MasiERP
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  # masierp-elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
  #   environment:
  #     - ES_JAVA_OPTS=-Xms256m -Xmx256m
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #   ports:
  #     - 127.0.0.1:9200:9200
  #     - 127.0.0.1:9300:9300
  #   healthcheck:
  #     test:
  #       - CMD
  #       - curl
  #       - "-f"
  #       - http://localhost:9200/_cluster/health?wait_for_status=green&timeout=10s
  #     interval: 5s
  #     timeout: 10s
  #     retries: 10

  consul:
    image: docker.io/bitnami/consul:1.17.0
    ports:
      - 8300:8300
      - 8500:8500
      - 8600:8600
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    volumes:
      - ./central-server-config:/config
    environment:
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./prometheus-conf/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=debug"
    ports:
      - 9090:9090
  alertmanager:
    image: prom/alertmanager:v0.26.0
    ports:
      - 9093:9093
    volumes:
      - ./alertmanager-conf/:/etc/alertmanager/
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"

  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
  masiutility:
    ports:
      - "8083:8083"
    image: masiutility
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiUtility
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiUtility
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8084/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      masierp-postgresql:
        condition: service_healthy
    restart: unless-stopped        
    volumes:
      - ./masiutility-upload:/uploaded-files
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka
    hostname: kafka
    container_name: kafka
    restart: unless-stopped  
    depends_on:
      - masi-zookeeper
  masi-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    restart: unless-stopped  

  #  masiweb:
  #    image: masiweb
  #    build:
  #      context: ../masi-web
  #    ports:
  #      - "9000:9000"
volumes:
  prometheus_data: { }
  grafana_data: { }
