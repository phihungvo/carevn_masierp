services:
  masierp:
    build:
      context: .
      dockerfile: masi-api/.devcontainer/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiERP
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiERP
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    restart: unless-stopped
    ports:
      - "8080:8080"
  masiemployee:
    build:
      context: .
      dockerfile: masi-app/employee/.devcontainer/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiEmployee
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiEmployee
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8081:8081"
    volumes:
      - ./masiemployee-upload:/uploaded-files
    restart: unless-stopped
  masilogistics:
    build:
      context: .
      dockerfile: masi-app/logistics/.devcontainer/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiLogistics
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiLogistics
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8090:8090"
    restart: unless-stopped
  masiproduction:
    build:
      context: .
      dockerfile: masi-app/production/.devcontainer/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiProduction
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiProduction
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8082:8082"
    restart: unless-stopped
  masisale:
    build:
      context: .
      dockerfile: masi-app/sale/.devcontainer/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiSale
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiSale
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8084:8083"
    restart: unless-stopped
    volumes:
      - ./masisale-upload:/uploaded-files
  masiutility:
    ports:
      - "8083:8083"
    build:
      context: .
      dockerfile: masi-app/production/.devcontainer/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://masierp-postgresql:5432/MasiUtility
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://masierp-postgresql:5432/MasiUtility
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    restart: unless-stopped
    volumes:
      - ./masiutility-upload:/uploaded-files
  masierp-postgresql:
    image: postgres:16.1
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=MasiERP
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
  consul:
    image: docker.io/bitnami/consul:1.17.0
    ports:
      - 8300:8300
      - 8500:8500
      - 8600:8600
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    volumes:
      - ./central-server-config:/config
    environment:
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - masi-zookeeper
  masi-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    restart: unless-stopped
volumes:
  prometheus_data: {}
  grafana_data: {}
