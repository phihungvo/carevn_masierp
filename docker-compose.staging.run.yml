services:
  build_shared:
    build:
      context: .
      dockerfile: masi-shared/Dockerfile
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - ENV MAVEN_PROJECTBASEDIR=/app
    image: masi-shared:latest
    networks:
      - masi-network

  masierp:
    build:
      context: .
      dockerfile: masi-api/Dockerfile.run
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=192.168.1.88
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://192.168.1.19:5432/MasiERP
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.19:5432/MasiERP
      - SPRING_LIQUIBASE_USER=basso
      - SPRING_LIQUIBASE_USERNAME=basso
      - SPRING_LIQUIBASE_PASSWORD=123123
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=192.168.1.88:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    depends_on:
      - build_shared
      - consul
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - masi-network

  masiemployee:
    build:
      context: .
      dockerfile: masi-app/employee/Dockerfile.run
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=192.168.1.88
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://192.168.1.19:5432/MasiEmployee
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.19:5432/MasiEmployee
      - SPRING_LIQUIBASE_USER=basso
      - SPRING_LIQUIBASE_USERNAME=basso
      - SPRING_LIQUIBASE_PASSWORD=123123
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=192.168.1.88:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8081:8081"
    volumes:
      - ./upload/masiemployee:/uploaded-files
    depends_on:
      - build_shared
      - consul
    restart: unless-stopped
    networks:
      - masi-network

  masilogistics:
    build:
      context: .
      dockerfile: masi-app/logistics/Dockerfile.run
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=192.168.1.88
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://192.168.1.19:5432/MasiLogistics
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.19:5432/MasiLogistics
      - SPRING_LIQUIBASE_USER=basso
      - SPRING_LIQUIBASE_USERNAME=basso
      - SPRING_LIQUIBASE_PASSWORD=123123
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=192.168.1.88:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8090:8090"
    depends_on:
      - build_shared
      - consul
    restart: unless-stopped
    networks:
      - masi-network

  masiproduction:
    build:
      context: .
      dockerfile: masi-app/production/Dockerfile.run
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=192.168.1.88
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://192.168.1.19:5432/MasiProduction
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.19:5432/MasiProduction
      - SPRING_LIQUIBASE_USER=basso
      - SPRING_LIQUIBASE_USERNAME=basso
      - SPRING_LIQUIBASE_PASSWORD=123123
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=192.168.1.88:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8082:8082"
    depends_on:
      - build_shared
      - consul
    restart: unless-stopped
    networks:
      - masi-network

  masisale:
    build:
      context: .
      dockerfile: masi-app/sale/Dockerfile.run
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=192.168.1.88
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://192.168.1.19:5432/MasiSale
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.19:5432/MasiSale
      - SPRING_LIQUIBASE_USER=basso
      - SPRING_LIQUIBASE_USERNAME=basso
      - SPRING_LIQUIBASE_PASSWORD=123123
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=192.168.1.88:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    ports:
      - "8084:8083"
    depends_on:
      - build_shared
      - consul
    restart: unless-stopped
    volumes:
      - ./upload/masisale:/uploaded-files
    networks:
      - masi-network

  masiutility:
    ports:
      - "8083:8083"
    build:
      context: .
      dockerfile: masi-app/utility/Dockerfile.run
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=192.168.1.88
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_R2DBC_URL=r2dbc:postgresql://192.168.1.19:5432/MasiUtility
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://192.168.1.19:5432/MasiUtility
      - SPRING_LIQUIBASE_USER=basso
      - SPRING_LIQUIBASE_USERNAME=basso
      - SPRING_LIQUIBASE_PASSWORD=123123
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=192.168.1.88:29092
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_DEFAULT_BROKER_PORT=29092
    depends_on:
      - build_shared
      - consul
    restart: unless-stopped
    volumes:
      - ./upload/masiutility:/uploaded-files
    networks:
      - masi-network

  consul:
    image: docker.io/bitnami/consul:1.17.0
    ports:
      - 8300:8300
      - 8500:8500
      - 8600:8600
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    networks:
      - masi-network

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    volumes:
      - ./docker-compose/central-server-config:/config
    environment:
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500
    networks:
      - masi-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 192.168.1.88:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_HOST_NAME: localhost
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - masi-zookeeper
    networks:
      - masi-network

  masi-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    restart: unless-stopped
    networks:
      - masi-network

networks:
  masi-network:
    driver: bridge
